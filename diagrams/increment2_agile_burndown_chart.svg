<circle cx="100" cy="138" r="4" fill="#1D9E75"/>
<circle cx="147" cy="155" r="4" fill="#1D9E75"/>
<circle cx="194" cy="172" r="4" fill="#1D9E75"/>
<circle cx="241" cy="189" r="4" fill="#1D9E75"/>
<circle cx="288" cy="206" r="4" fill="#1D9E75"/>
<circle cx="335" cy="214" r="4" fill="#1D9E75"/>
<circle cx="382" cy="214" r="4" fill="#1D9E75"/>
<circle cx="430" cy="223" r="4" fill="#1D9E75"/>
<circle cx="477" cy="240" r="4" fill="#1D9E75"/>
<circle cx="524" cy="265" r="4" fill="#1D9E75"/>
<circle cx="571" cy="291" r="4" fill="#1D9E75"/>
<circle cx="618" cy="324" r="4" fill="#1D9E75"/>
<circle cx="665" cy="367" r="4" fill="#1D9E75"/>
<circle cx="712" cy="409" r="4" fill="#1D9E75"/>
<circle cx="760" cy="460" r="4" fill="#1D9E75"/>

<!-- Legend -->
<rect x="560" y="104" width="220" height="78" rx="6" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="1.1"/>
<text x="570" y="118" font-size="10.5" fill="#3C3489" text-anchor="start" font-weight="700" dominant-baseline="central">Legend</text>
<line x1="570" y1="132" x2="606" y2="132" stroke="#3C3489" stroke-width="2.2"/>
<circle cx="588" cy="132" r="3.5" fill="#3C3489"/>
<text x="614" y="132" font-size="10" fill="#2D3B3A" text-anchor="start" dominant-baseline="central">Ideal Burndown</text>
<line x1="570" y1="154" x2="606" y2="154" stroke="#1D9E75" stroke-width="2.2" stroke-dasharray="8 4"/>
<circle cx="588" cy="154" r="3.5" fill="#1D9E75"/>
<text x="614" y="154" font-size="10" fill="#2D3B3A" text-anchor="start" dominant-baseline="central">Actual Burndown</text>
<text x="570" y="172" font-size="9.5" fill="#6B6B66" text-anchor="start" dominant-baseline="central">Sprint completed on day 14</text>

<!-- Annotation -->
<rect x="250" y="84" width="210" height="40" rx="4" fill="#FFF8E1" stroke="#F39C12" stroke-width="0.8"/>
<text x="355" y="100" font-size="9.5" fill="#7D6608" text-anchor="middle" font-weight="600" dominant-baseline="central">Days 5&#8211;7: plateau (+7.3 pts)</text>
<text x="355" y="114" font-size="9" fill="#7D6608" text-anchor="middle" dominant-baseline="central">DFS traversal rework (US-13)</text>
<line x1="355" y1="124" x2="382" y2="208" stroke="#F39C12" stroke-width="0.8"/>
</svg>
